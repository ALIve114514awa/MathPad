name: Verify Windows portable app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MATHPAD_TEST_NO_FOCUS_CHECKS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:geogebra
      - run: npm run verify:licenses
      - run: npm run verify:portable
      - run: npm run test:portable
      - name: Verify offline math in the packaged app
        shell: pwsh
        run: |
          $env:MATHPAD_TEST_APP_ROOT = Join-Path $PWD 'runtime/resources/app.asar'
          npm run test:app
      - name: Verify Python mathematical input in the packaged app
        shell: pwsh
        run: |
          $env:MATHPAD_TEST_APP_ROOT = Join-Path $PWD 'runtime/resources/app.asar'
          npm run test:python
      - name: Verify settings in the packaged app
        shell: pwsh
        run: |
          $env:MATHPAD_TEST_APP_ROOT = Join-Path $PWD 'runtime/resources/app.asar'
          npm run test:settings
